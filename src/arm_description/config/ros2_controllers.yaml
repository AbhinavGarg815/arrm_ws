# controller_manager configuration.
# MoveIt needs a FollowJointTrajectory action, so the arm runs a
# JointTrajectoryController rather than the exporter's ForwardCommandControllers.

controller_manager:
  ros__parameters:
    # The DS51150 firmware runs its own 200 Hz cascade and reports at 50 Hz, so
    # there is nothing to gain above ~100 Hz here. The serial link is the limit.
    update_rate: 100  # Hz

    # Touch the hardware at startup not at all. ros2_control throws if a
    # component cannot reach its declared initial state, and the throw aborts
    # the whole controller manager - so a missing /dev/ttyACM0 used to kill the
    # node and leave RViz "executing" against nothing. `unconfigured` asks for
    # no transition, and demo.launch.py configures and activates as explicit
    # steps where a failure is a readable error.
    hardware_components_initial_state:
      unconfigured:
        - arm_system

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController


joint_state_broadcaster:
  ros__parameters:
    use_local_topics: false


arm_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    interpolation_method: splines

    # Tolerances are sized from measured hardware.
    #
    # trajectory (|traj - meas|) must never abort before the firmware's own jam
    # detector, because only the firmware can tell a jam from the approach lag:
    # it compares |set - meas|, which excludes the lag. The firmware approaches
    # the host target through a first-order filter (TRAJ_APPROACH_W = 5.0/s),
    # lagging v/W = 8.0 deg at the 40 deg/s limit, and trips at FAULT_ERR_DEG =
    # 8.0, so the worst host-side error it still tolerates is 16.0 deg.
    # 0.35 rad = 20.05 deg sits 4 deg beyond that. Approach lag keeps a joint on
    # the path and behind in time, so this does not let the arm leave the path.
    # The wrist stays at 0.175: the ST3215s run their own loop with no
    # host-side approach filter.
    #
    # goal is ~2x that joint's measured backlash (0.52 / 0.77 / 1.08 deg). The
    # firmware stops correcting once the error is inside the backlash, and the
    # approach can leave another backlash of residual, so twice is the honest
    # bound on where a joint settles. Tightening these needs less backlash, not
    # a smaller number here.
    #
    # The wrist gets 2 deg because an ST3215 driven by goal-position writes has
    # a static error under load - its internal loop stops at its own deadband
    # and nothing on this side can push further. A measured 1.36 deg residual
    # aborted moves at 1 deg. Earning a tighter number means tuning the servos'
    # PID registers (21/22/23) and re-measuring.
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 2.0
      joint1: { trajectory: 0.350, goal: 0.026 }   # 1.5 deg, backlash 0.52
      joint2: { trajectory: 0.350, goal: 0.036 }   # 2.1 deg, backlash 0.77
      joint3: { trajectory: 0.350, goal: 0.046 }   # 2.6 deg, backlash 1.08
      joint4: { trajectory: 0.175, goal: 0.035 }   # 2.0 deg
      joint5: { trajectory: 0.175, goal: 0.035 }
      joint6: { trajectory: 0.175, goal: 0.035 }

    state_publish_rate: 50.0
    action_monitor_rate: 20.0

    # Start from wherever the hardware says it is, not from the last command:
    # on the real arm the servos may be parked anywhere, and commanding zero on
    # activation would lunge.
    allow_partial_joints_goal: false
    open_loop_control: false


gripper_controller:
  ros__parameters:
    joints:
      - Slider_39
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 2.0
      Slider_39: { trajectory: 0.01, goal: 0.002 }
    state_publish_rate: 50.0
    action_monitor_rate: 20.0

; ST3215 wrist firmware for the Waveshare ESP32 Servo Driver Expansion Board.
; Waveshare's own ServoDriver demo is backed up in ../esp32_stock_backup/.
;
;   pio run -e arm  -t upload     # production: 3 servos, streaming, for ROS
;   pio run -e test -t upload     # bring-up: one servo at a time, by hand

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags = -Wall

; Production firmware. Same protocol shape as the Mega's arm3: safe at boot,
; checksummed commands, binary status frame, dead-man, load trip.
[env:arm]
build_src_filter = +<st3215_arm.cpp>

; Bring-up firmware: scan, hold one servo, move it by hand. Driven by
; ~/ros2_ws/tools/motor_test.py esp-scan / esp-joint.
[env:test]
build_src_filter = +<st3215_test.cpp>
